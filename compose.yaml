# DEV-конфигурация. Production — отдельно, в compose.prod.yaml.
#
#   docker compose up --build                       -> api + postgres + redis
#   docker compose --profile full up --build        -> + worker, beat, minio, mailpit

x-backend: &backend
  build:
    context: ./backend
    target: runtime
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    S3_ENDPOINT_URL: http://minio:9000
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  api:
    <<: *backend
    # Hot reload только для dev
    command: >
      gunicorn --bind 0.0.0.0:8000 --workers 1 --reload
      --access-logfile - "app:create_app()"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432"   # только localhost, не в интернет
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---- профиль "full": включай по мере прохождения этапов 10–12 ----
  worker:
    <<: *backend
    profiles: ["full"]
    command: celery -A app.tasks.celery_app:celery worker --loglevel=INFO
    volumes:
      - ./backend/app:/app/app
    healthcheck:
      disable: true

  beat:
    <<: *backend
    profiles: ["full"]
    # Ровно ОДИН инстанс beat — не масштабировать
    command: celery -A app.tasks.celery_app:celery beat --loglevel=INFO --schedule /tmp/celerybeat-schedule
    volumes:
      - ./backend/app:/app/app
    healthcheck:
      disable: true

  minio:
    image: minio/minio:latest
    profiles: ["full"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    profiles: ["full"]
    ports:
      - "127.0.0.1:8025:8025"   # web UI с перехваченными письмами
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata: