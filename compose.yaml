# DEV-конфигурация. Production — отдельно, в compose.prod.yaml.  

x-backend: &backend
  build:
    context: ./backend
    target: runtime
  env_file: .env
  restart: unless-stopped

services:
  api:
    <<: *backend
    # Hot reload только для dev
    command: >
      gunicorn --bind 0.0.0.0:8000 --workers 1 --reload
      --no-control-socket --access-logfile - "app:create_app()"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
